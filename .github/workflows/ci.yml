name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Test Help & CLI Flags
      run: |
        python3 docker_sweep.py --help
        python3 docker_sweep.py --status
        python3 docker_sweep.py --cache --dry-run
        python3 docker_sweep.py --dangling --dry-run
